<!doctype html>
<meta charset="utf-8">
<title>Orders</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1f7; --card:#fff; --ink:#101828; --muted:#667085; --line:#e6e9f0;
    --accent:#3b5bdb; --accsoft:#eef2ff;
    --green:#067647; --greenbg:#e7f6ec; --red:#b42318; --redbg:#fde7e5;
    --amber:#b54708; --amberbg:#fff4e5; --purple:#6941c6; --purplebg:#f4f0fe;
    --grey:#475467; --greybg:#eef1f5; --blue:#1456c4; --bluebg:#e7f0fd;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;display:flex;flex-direction:column;overflow:hidden;
       font:13px/1.45 'Montserrat',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .flexnone{flex:none}

  /* top bar */
  .top{display:flex;align-items:center;gap:14px;padding:11px 18px;background:var(--card);
       border-bottom:1px solid var(--line);box-shadow:var(--shadow);z-index:30;flex-wrap:wrap}
  .brand{font-weight:800;letter-spacing:-.02em;font-size:16px;margin-right:4px}
  .brand b{color:var(--accent)}
  .tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--bg);padding:4px;border-radius:11px}
  .tab{padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted);transition:.12s;white-space:nowrap}
  .tab:hover{color:var(--ink)}
  .tab.on{background:var(--card);color:var(--accent);box-shadow:var(--shadow)}
  .top input[type=search],.top select{padding:8px 11px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff;color:var(--ink)}
  .top input[type=search]{min-width:240px}
  .top input[type=search]:focus,.top select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accsoft)}
  .spacer{flex:1}
  .count{color:var(--muted);font-weight:600;font-size:12px}
  .ghost{padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;font:inherit;font-weight:600;color:var(--muted)}
  .ghost:hover{border-color:var(--accent);color:var(--accent)}
  label.chk{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;cursor:pointer}

  /* KPI boxes */
  .kpis{display:flex;gap:12px;padding:13px 18px;flex-wrap:wrap;background:transparent}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 16px;min-width:130px;
       box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);opacity:.9}
  .kpi.k0::before{background:var(--accent)} .kpi.k1::before{background:var(--green)}
  .kpi.k2::before{background:var(--purple)} .kpi.k3::before{background:var(--amber)}
  .kpi.k4::before{background:var(--red)} .kpi.k5::before{background:var(--blue)}
  .kv-num{font-size:21px;font-weight:800;letter-spacing:-.02em}
  .kv-lab{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-top:2px}

  /* filter bar */
  .bar{display:flex;gap:7px;padding:2px 18px 12px;flex-wrap:wrap;align-items:center}
  .bar .lbl{color:var(--muted);font-weight:600;font-size:12px;margin-right:2px}
  .chip{padding:6px 13px;border-radius:20px;border:1px solid var(--line);cursor:pointer;font-weight:600;color:var(--muted);background:#fff;font-size:12px;transition:.12s}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip.issues.on{background:var(--red);border-color:var(--red)}

  /* table */
  .wrap{flex:1;overflow:auto;margin:0 14px 14px;background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px;white-space:nowrap}
  thead th{position:sticky;top:0;background:#f3f5fb;border-bottom:1px solid var(--line);
           padding:9px 11px;text-align:left;font-weight:700;cursor:pointer;z-index:5;color:#3a4253}
  thead th:hover{background:#e9edf8}
  td{padding:7px 11px;border-bottom:1px solid var(--line);max-width:300px;overflow:hidden;text-overflow:ellipsis}
  tbody tr{cursor:pointer}
  tbody tr:nth-child(even){background:#fafbfe}
  tbody tr:hover{background:var(--accsoft)}
  td.idcol{position:sticky;left:0;background:inherit;font-weight:600;border-right:1px solid var(--line)}
  tbody tr:hover td.idcol{background:var(--accsoft)}
  tr.issue td.idcol{box-shadow:inset 3px 0 0 var(--red)}
  tr.lowmargin td{background:#fff1f0}
  tr.lowmargin:hover td{background:#ffe0de}
  tr.lowmargin td.idcol{box-shadow:inset 3px 0 0 #b54708}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-weight:700;font-size:11px}
  .l-Completed{background:var(--greenbg);color:var(--green)} .l-Loss{background:var(--redbg);color:var(--red)}
  .l-Incomplete{background:var(--amberbg);color:var(--amber)} .l-Refunded{background:var(--purplebg);color:var(--purple)}
  .l-Cancelled{background:var(--greybg);color:var(--grey)} .l-Pending{background:var(--bluebg);color:var(--blue)}
  .rb{display:inline-block;padding:1px 7px;border-radius:5px;font-size:10.5px;font-weight:700;margin-right:3px;background:var(--amberbg);color:var(--amber)}
  .neg{color:var(--red);font-weight:700} .pos{color:var(--green);font-weight:700}
  .flagdot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
  /* row quick-actions (label without opening the drawer) */
  .actcell{white-space:nowrap;cursor:default}
  .actcell .qsc{text-decoration:none;color:var(--accent);font-weight:800;font-size:14px;margin-right:7px}
  .actcell .qsc:hover{color:var(--ink)}
  .actcell .qflag{width:12px;height:12px;border-radius:50%;display:inline-block;vertical-align:middle;margin-right:3px;cursor:pointer;border:1px solid rgba(0,0,0,.18);transition:transform .1s}
  .actcell .qflag:hover{transform:scale(1.3)}
  .actcell .qtag{cursor:pointer;margin-left:4px;font-size:12.5px;opacity:.6}
  .actcell .qtag:hover{opacity:1}
  #qmenu{position:fixed;z-index:70;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(16,24,40,.24);padding:5px;min-width:158px;display:none}
  #qmenu .qmi{padding:6px 11px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap}
  #qmenu .qmi:hover{background:var(--accsoft);color:var(--accent)}
  #qmenu .qmi.on{color:var(--accent)}
  /* tag chips — ONE style everywhere (table cells, tracker, drawer) */
  .tagchip{display:inline-block;background:var(--accsoft);color:var(--accent);border:0;border-radius:20px;
           padding:1px 8px;font-size:10.5px;font-weight:700;margin-right:3px;white-space:nowrap;vertical-align:middle}
  button.tagchip{cursor:pointer;border:1px solid var(--accent);padding:3px 10px;font-size:11px;font-family:inherit;transition:.12s}
  button.tagchip:hover{background:var(--accent);color:#fff}

  /* drawer */
  #ov{position:fixed;inset:0;background:rgba(16,24,40,.4);display:none;z-index:50;backdrop-filter:blur(1px)}
  #dw{position:fixed;top:0;right:0;width:580px;max-width:96vw;height:100%;background:#fff;
      box-shadow:-12px 0 40px rgba(16,24,40,.22);overflow:auto;padding:20px 22px}
  #dw h2{margin:0 0 2px;font-size:17px;letter-spacing:-.01em} #dw .sub{color:var(--muted);margin-bottom:14px}
  .sect{margin:16px 0 6px;font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);border-bottom:1px solid var(--line);padding-bottom:5px}
  .kv{display:grid;grid-template-columns:160px 1fr;gap:4px 12px;font-size:12.5px}
  .kv b{color:var(--muted);font-weight:600} .kv span{word-break:break-word}
  .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:11px 0}
  .actions button,.actions select{padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font:inherit}
  .actions button.save{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;font:inherit;min-height:56px}
  .note{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 11px;margin:6px 0;font-size:12.5px}
  .note small{color:var(--muted)}
  .close{float:right;cursor:pointer;font-size:24px;color:var(--muted);line-height:1}
  .close:hover{color:var(--ink)}

  /* insights */
  #insights,#dhealth,#refunds,#pnl,#bank,#severe,#data,#tracker,#unmapped,#needs_priority,#walmart,#listings,#reminders{flex:1;overflow:auto;padding:0 18px 18px}
  .igrp{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:13px;overflow:hidden;box-shadow:var(--shadow)}
  .igrp h3{margin:0;padding:11px 16px;background:#f3f5fb;font-size:13px;display:flex;justify-content:space-between;font-weight:700}
  .irow{padding:9px 16px;border-top:1px solid var(--line);display:flex;gap:11px;align-items:center}
  .irow:hover{background:var(--accsoft)}
  .sev{width:9px;height:9px;border-radius:50%;flex:none}.sev.high{background:var(--red)}.sev.med{background:var(--amber)}
  .catbadge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--accsoft);color:var(--accent);flex:none}
  .irow .msg{flex:1;color:#3a4253}.irow .oid{font-weight:700;cursor:pointer;color:var(--accent);flex:none}
  .mini{padding:4px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;font-size:11px;font-weight:600;color:var(--muted)}
  .mini:hover{border-color:var(--accent);color:var(--accent)}
  .empty{padding:60px;text-align:center;color:var(--muted);font-size:15px}
  /* seller-central link + asin link */
  .sclink{display:inline-block;color:var(--accent);font-weight:600;text-decoration:none;border:1px solid var(--accent);padding:5px 11px;border-radius:8px}
  .sclink:hover{background:var(--accsoft)}
  .asinlink{color:var(--accent);cursor:pointer;text-decoration:underline}
  .asinlink:hover{color:var(--ink)}
  /* ASIN analysis modal */
  #aov,#sov,#zov{position:fixed;inset:0;background:rgba(16,24,40,.4);display:none;z-index:60;align-items:flex-start;justify-content:center;overflow:auto;padding:30px;backdrop-filter:blur(1px)}
  #adw,#sdw,#zdw{background:#fff;border-radius:14px;box-shadow:0 24px 64px rgba(16,24,40,.32);padding:20px 24px;width:900px;max-width:96vw}
  #zdw h2{margin:0 0 2px;font-size:16px}
  #sdw h2{margin:0 0 2px;font-size:16px}
  #adw h2{margin:0 0 2px;font-size:16px}
  .legend{font-size:11px;color:var(--muted);margin:6px 0 4px}
  .legend .lg{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:middle;margin-right:3px}
  .states{display:flex;flex-direction:column;gap:5px;margin-top:4px}
  .strow{display:flex;align-items:center;gap:8px;font-size:12px}
  .stlab{width:40px;font-weight:700;text-align:right;color:var(--ink)}
  .stbar{height:15px;background:var(--accent);border-radius:4px;min-width:2px}
  .stn{color:var(--muted);font-weight:600}
  .charttip{position:absolute;pointer-events:none;background:#0f1830;color:#fff;font-size:11.5px;line-height:1.5;
            padding:8px 11px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:5;min-width:150px}
  .charttip b{color:#fff} .charttip .ch{color:#fdba74;font-weight:700}
  .chiptog{display:inline-block;padding:3px 10px;border-radius:20px;border:1px solid var(--line);cursor:pointer;font-size:11px;font-weight:600;margin-right:5px;user-select:none}
  .chiptog .lg{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:middle;margin-right:4px}
  .chiptog.off{opacity:.4}
  /* live Gmail refund / return banner */
  .alertbox{border-radius:10px;padding:10px 13px;margin:10px 0;font-size:12.5px;border:1px solid}
  .alertbox b{display:block;margin-bottom:3px;font-weight:700}
  .alertbox.rf{background:var(--redbg);border-color:var(--red);color:var(--red);animation:pulse 1.6s ease 2}
  .alertbox.rt{background:var(--amberbg);border-color:var(--amber);color:var(--amber)}
  /* animations */
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes slideIn{from{transform:translateX(28px);opacity:0}to{transform:translateX(0);opacity:1}}
  @keyframes popIn{from{transform:scale(.97);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes rise{from{transform:translateY(7px);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(180,35,24,0)}50%{box-shadow:0 0 0 4px rgba(180,35,24,.18)}}

  /* Enhanced Modal & Commenting styles */
  .zbadge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:700;letter-spacing:.02em}
  .zbadge-acct{background:#e0e7ff;color:#3730a3}
  .zbadge-green{background:#dcfce7;color:#15803d}
  .zbadge-amber{background:#fef3c7;color:#b45309}
  .zbadge-blue{background:#e0f2fe;color:#0369a1}
  .zbadge-purple{background:#f3e8ff;color:#7e22ce}

  .zcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 16px;box-shadow:var(--shadow)}
  .zgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px 16px;font-size:12px}
  .zitem{display:flex;flex-direction:column;gap:1px}
  .zlbl{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
  .zval{font-size:12.5px;font-weight:600;color:var(--ink);word-break:break-word}

  .ztable{width:100%;border-collapse:collapse;font-size:12px}
  .ztable th{background:#f8fafc;color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
  .ztable td{padding:7px 8px;border-bottom:1px solid var(--line)}

  .cfeed-list{display:flex;flex-direction:column;gap:8px;max-height:220px;overflow-y:auto;padding-right:4px;margin-bottom:12px}
  .cfeed-item{display:flex;gap:10px;align-items:flex-start;background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:9px 12px;transition:background .12s}
  .cfeed-item:hover{background:#f1f5f9}
  .cfeed-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#2544c2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
  .cfeed-body{flex:1;min-width:0}
  .cfeed-meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-bottom:2px}
  .cfeed-author{font-weight:700;color:var(--ink)}
  .cfeed-time{color:var(--muted);font-size:10.5px}
  .cfeed-text{font-size:12.5px;color:var(--ink);line-height:1.45;word-break:break-word}

  .qchips-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .qchip{background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:4px 10px;font-size:11.5px;font-weight:600;color:var(--ink);cursor:pointer;transition:all .12s;display:inline-flex;align-items:center;gap:4px;font-family:inherit}
  .qchip:hover{background:var(--accsoft);border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
  .qchip:active{transform:translateY(0)}

  .cinput-wrap{position:relative}
  .cinput-box{width:100%;min-height:64px;max-height:140px;padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;font-family:inherit;font-size:12.5px;line-height:1.4;resize:vertical;transition:border-color .15s,box-shadow .15s;box-sizing:border-box}
  .cinput-box:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accsoft)}
  .cbtn-submit{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:7px 15px;font-weight:700;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:inherit;transition:opacity .15s,transform .1s}
  .cbtn-submit:hover{opacity:.9}
  .cbtn-submit:active{transform:scale(.98)}
  #ov,#aov{animation:fadeIn .15s ease}
  #dw{animation:slideIn .22s cubic-bezier(.2,.8,.2,1)}
  #adw{animation:popIn .2s cubic-bezier(.2,.8,.2,1)}
  .kpi{transition:transform .15s ease,box-shadow .15s ease;animation:rise .25s ease both}
  .kpi:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(16,24,40,.13)}
  .igrp{animation:rise .2s ease both}
  .tab,.chip,.chiptog,.ghost,.sclink,.mini,.asinlink{transition:all .14s ease}
  tbody tr{transition:background .1s ease}
  .badge{transition:transform .12s ease}
  
  html.restricted-mode .tabs .tab:not([data-tab="placed"]):not([data-tab="listings"]):not([data-tab="tracker"]):not([data-tab="orders"]):not([data-tab="pnl"]) {
      display: none !important;
  }
  html.restricted-mode #chatFab, html.restricted-mode #chatPanel, html.restricted-mode #whoami {
      display: none !important;
  }
</style>

<!-- ── Team chat (floating, all tabs) + Reminder Center styles ── -->
<style>
  #chatFab{position:fixed;bottom:18px;right:18px;width:52px;height:52px;border-radius:50%;
    background:var(--accent,#3b5bdb);color:#fff;font-size:23px;display:flex;align-items:center;
    justify-content:center;cursor:pointer;box-shadow:0 6px 18px rgba(30,50,120,.35);z-index:400;user-select:none}
  #chatFab:hover{transform:scale(1.06)}

<script>
const KEY_COLS = ["amazon_order_id","order_label","tags","account","purchase_date","asin","sku","title",
 "quantity","earnings","zoro_order_total","profit_dollars","profit_percent","zoro_account_name",
 "tracking_ids","delivery_status","delivery_date","on_time","return_requested","refund_done",
 "customer_messaged","ship_name","ship_city","ship_state"];
// Placed tab leads with placed_at (placement date); purchase_date kept as the Amazon order date.
const PLACED_COLS = ["placed_at","amazon_order_id","account","profile_name","purchase_date","asin","sku",
 "alt_used","main_sku","main_sku_status","title",
 "quantity","earnings","zoro_order_total","zoro_tax","profit_dollars","profit_percent","coupon_used",
 "wb_order_id","tracking_ids","ship_name","ship_city","ship_state"];
const MONEY = new Set(["earnings","zoro_order_total","zoro_subtotal","zoro_shipping","zoro_tax",
 "profit_dollars","net_profit_after_refund","refund_amount","item_price","shipping_price","amazon_fees","coupon_savings"]);
const DELIV = new Set(["Delivered","AllDelivered"]);
const INAMES={item_price_change:"Item price changed",zoro_price_change:"Zoro base price changed",
 wrong_qty:"Wrong quantity",zoro_code_change:"Zoro code changed",low_margin:"Low margin",
 shipping_change:"Shipping changed",zip_mismatch:"Zip mismatch",undelivered:"Undelivered (past due)",
 refunded:"Refunded",wb_unmatched:"WB not in placed orders",
 zoro_deliver_mismatch:"Zoro vs Amazon delivery",low_zoro_stock:"Low Zoro stock",
 shipped_late:"Shipped late (vs ship-by)",zoro_slow_risk:"Zoro slower than promise (late risk)",
 earnings_unit_change:"Earnings/unit changed",shipping_amt_change:"Amazon shipping/unit changed",
 handling_time_change:"Handling time changed",zoro_ship_rule:"Zoro shipping ≠ rule ($50 free / $5.99)",
 zoro_unit_cost_change:"Zoro unit cost changed"};
const TODAY=new Date().toISOString().slice(0,10);
let TAB="orders", LABEL="", ISSUES=false, REASON="", ICAT="", ROWS=[], DATE_FROM="", DATE_TO="";
let MARGIN_MIN="", MARGIN_MAX="", TAXONLY=false, NOTAX=false, STATEF="", STATES=[], DATECOL="purchase_date";
let TAGF="", FLAGF="", TAGS_ALL=[];   // tag + flag-color filters (client-side, rows carry tags/flag_color via CRM overlay)
const RENDER_STEP=400;                 // rows painted per bulk ("Show more" reveals the next bulk)
let RENDER_CAP=RENDER_STEP;            // current paint depth; reset whenever fresh data loads
let ALTF=false;   // Placed tab: show only orders placed with the ALTERNATIVE Zoro code (main was OOS)
function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10);}

const $=s=>document.querySelector(s), api=async(u,o)=>(await fetch(u,o)).json();
const d5=z=>(""+(z||"")).replace(/\D/g,"").slice(0,5);
const esc=s=>(""+(s??"")).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const money=n=>(n<0?"-$":"$")+Math.abs(Math.round(n)).toLocaleString();

function isIssue(o){
  const p=o.profit_dollars, deliv=DELIV.has(o.delivery_status);
  if(p!=null&&p<0) return true;
  if(deliv&&!(o.tracking_ids||"").trim()) return true;
  if(o.order_label==="Completed"&&(!o.earnings||!o.zoro_order_total)) return true;
  if(o.refund_done==="Yes") return true;
  if(o.earnings&&!o.zoro_order_total) return true;
  const a=d5(o.ship_postal_code), z=d5(o.zoro_buyer_zip);
  if(a.length===5&&z.length===5&&a!==z) return true;
  return false;
}
function unreason(o){
  const r=[];
  if(o.refund_done==="Yes"||o.gmail_refund) r.push("Refunded");
  if(o.order_label==="Incomplete") r.push("Incomplete");
  const db=(o.deliver_by_date||"").slice(0,10);
  if(!DELIV.has(o.delivery_status)&&o.manual_delivered!=="Yes"&&db&&db<TODAY) r.push("Past-due");
  const a=d5(o.ship_postal_code), z=d5(o.zoro_buyer_zip);
  if(a.length===5&&z.length===5&&a!==z) r.push("Zip mismatch");
  return r;
}
function fmt(k,v){
  if(v==null||v==="") return "";
  if(MONEY.has(k)){const n=+v; if(!isNaN(n))return (n<0?"-$":"$")+Math.abs(n).toFixed(2);}
  return ""+v;
}
function cell(k,v,o){
  if(k==="order_label") return `<span class="badge l-${esc(v)}">${esc(v)||""}</span>`;
  if(k==="tags") return tagList(o).map(t=>`<span class="tagchip">${esc(t)}</span>`).join("");
  if(k==="amazon_order_id"){const f=o.flag_color?`<span class="flagdot" style="background:${esc(o.flag_color)}"></span>`:"";return f+esc(v);}
  if(k==="asin" && v){const a=(""+v).split(",")[0].trim();return `<span class="asinlink" onclick="event.stopPropagation();openAsin('${esc(a)}')">${esc(v)}</span>`;}
  if(k==="alt_used") return v==="Yes"?`<span class="badge" style="background:#fef0c7;color:#b54708;border:1px solid #f9dbaf" title="placed with the ALTERNATIVE Zoro code — main SKU (main_sku column) was OOS">🔄 ALT</span>`:"";
  if(k==="main_sku_status"&&v){const ok=v==="IN_STOCK";
    return `<span class="badge" style="background:${ok?'#d1fadf':'#fee4e2'};color:${ok?'#067647':'#b42318'}" title="main SKU last checked ${esc(o.main_sku_status_at||'?')}">${ok?'✓ back in stock':esc(v)}</span>`;}
  if(MONEY.has(k)){const n=+v;const cls=(k==="profit_dollars"&&n<0)?"neg":(k==="profit_dollars"&&n>0?"pos":"");return `<span class="${cls}">${fmt(k,v)}</span>`;}
  return esc(fmt(k,v));
}

async function loadFacets(){
  try{
    const f=await api("/api/facets");
    $("#account").innerHTML='<option value="">All accounts</option>'+(f.accounts||[]).map(a=>`<option>${esc(a)}</option>`).join("");
    $("#zaccount").innerHTML='<option value="">All Zoro accts</option>'+(f.zoro_accounts||[]).map(z=>`<option>${esc(z)}</option>`).join("");
    $("#profile").innerHTML='<option value="">All profiles</option>'+(f.profiles||[]).map(p=>`<option>${esc(p)}</option>`).join("");
    STATES=f.states||[];
    TAGS_ALL=f.tags||[];
    buildBar();   // re-render the filter bar so the Tag/State dropdowns get their options
  }catch(e){}
}
async function loadOrders(){
  const p=new URLSearchParams();
  if(!$("#allcols").checked) p.set("cols","key");   // pruned payload (~2.5x smaller); toggle refetches full
  if(TAB==="placed") p.set("src","placed");   // Placed = placement log (order_placer_orders), date = placed_at
  else if(TAB==="unresolved") p.set("flag","unresolved");
  else if(LABEL) p.set("label",LABEL);
  if($("#q").value.trim()) p.set("q",$("#q").value.trim());
  if(TAGF) p.set("tag",TAGF);   // server-side: the 3000-row LIMIT must not hide old tagged orders
  if($("#account").value) p.set("account",$("#account").value);
  if($("#zaccount").value) p.set("zoro_account",$("#zaccount").value);
  if($("#profile").value) p.set("profile",$("#profile").value);
  if(TAB!=="placed" && DATECOL!=="purchase_date") p.set("datecol",DATECOL);  // filter by ship date
  if(DATE_FROM) p.set("from",DATE_FROM);
  if(DATE_TO) p.set("to",DATE_TO);
  const r=await api("/api/orders?"+p.toString());
  ROWS=r.orders||[];
  RENDER_CAP=RENDER_STEP;   // fresh data → start at the first bulk again
  renderTable();
}
function renderKPIs(rows){
  const sum=k=>rows.reduce((s,o)=>s+(+o[k]||0),0);
  const earn=sum("earnings"), prof=sum("profit_dollars"), cost=sum("zoro_order_total"), coup=sum("coupon_savings");
  const mgn=earn?(prof/earn*100).toFixed(1)+"%":"—";
  let cards;
  if(TAB==="placed"){const altn=rows.filter(o=>(o.alt_used||"")==="Yes").length;
    cards=[["Placed",rows.length],["🔄 ALT placed",altn],["Est. earnings",money(earn)],["Est. cost",money(cost)],["Est. profit",money(prof)],["Total margin",mgn],["Coupon saved",money(coup)]];}
  else if(TAB==="unresolved"){const c=n=>rows.filter(o=>unreason(o).includes(n)).length;
    cards=[["Unresolved",rows.length],["Refunded",c("Refunded")],["Incomplete",c("Incomplete")],["Past-due",c("Past-due")],["Zip mismatch",c("Zip mismatch")],["At-risk profit",money(prof)]];}
  else {
    const se=rows.filter(o=>o.shipped_on_time==="Early").length;
    const sl=rows.filter(o=>o.shipped_on_time==="Late").length;
    cards=[["Orders",rows.length],["Earnings",money(earn)],["Profit",money(prof)],["Total margin",mgn],
           ["Shipped early",se],["Shipped late",sl],["Coupon saved",money(coup)],["Issues",rows.filter(isIssue).length]];
  }
  $("#kpis").innerHTML=cards.map(([l,v],i)=>`<div class="kpi k${i%6}"><div class="kv-num">${v}</div><div class="kv-lab">${l}</div></div>`).join("");
}
function renderTable(){
  let rows=ROWS.slice();
  if(TAB==="placed"&&ALTF) rows=rows.filter(o=>(o.alt_used||"")==="Yes");
  if(TAB==="unresolved"&&REASON) rows=rows.filter(o=>unreason(o).includes(REASON));
  if(MARGIN_MIN!=="") rows=rows.filter(o=>o.profit_percent!=null&&o.profit_percent!==""&&+o.profit_percent>=+MARGIN_MIN);
  if(MARGIN_MAX!=="") rows=rows.filter(o=>o.profit_percent!=null&&o.profit_percent!==""&&+o.profit_percent<=+MARGIN_MAX);
  if(TAXONLY) rows=rows.filter(o=>(+o.zoro_tax||0)>0);
  if(NOTAX) rows=rows.filter(o=>(+o.zoro_tax||0)===0);
  if(STATEF) rows=rows.filter(o=>(o.ship_state||"")===STATEF);
  if(TAGF) rows=rows.filter(o=>tagList(o).includes(TAGF));
  if(FLAGF) rows=rows.filter(o=>(o.flag_color||"")===FLAGF);
  rows=applySort(rows);  // keep the active sort on every render, incl. the 30s live refresh
  renderKPIs(rows);
  let base=($("#allcols").checked&&rows[0])?Object.keys(rows[0]).filter(c=>c!=="id"):(TAB==="placed"?PLACED_COLS:KEY_COLS).slice();
  if (document.documentElement.classList.contains("restricted-mode")) {
      base = base.filter(c => !["ship_name", "buyer", "ship_to", "zoro_buyer_zip"].includes(c));
  }
  // "act" = the leftmost quick-action column (SC link + flag dots + tag menu) so
  // you can label an order straight from the row without opening the drawer.
  const head=["act"].concat(TAB==="unresolved"?["why"]:[]).concat(base);
  $("#tbl thead").innerHTML="<tr>"+head.map(c=>`<th data-c="${c}">${c==="act"?"":c}</th>`).join("")+"</tr>";
  // Render in BULKS: only the first RENDER_CAP rows go into the DOM (a 3000-row × 25-col table
  // is what made the page crawl, especially on older machines). KPIs/sort/filters above still
  // use ALL rows — this only limits what's painted. "Show more" reveals the next bulk.
  const shown=rows.slice(0,RENDER_CAP);
  $("#tbl tbody").innerHTML=shown.map(o=>{
    const iss=isIssue(o)?" issue":"";
    const lm=(o.profit_percent!=null&&o.profit_percent!==""&&+o.profit_percent<8)?" lowmargin":"";
    const tds=head.map((c,i)=>{
      const sticky=i===0?"idcol":"";
      if(c==="act") return actCell(o,sticky);
      if(c==="why") return `<td class="${sticky}">${unreason(o).map(x=>`<span class="rb">${x}</span>`).join("")}</td>`;
      return `<td class="${sticky}" title="${esc(o[c])}">${cell(c,o[c],o)}</td>`;
    }).join("");
    return `<tr class="${iss}${lm}" data-id="${esc(o.amazon_order_id)}">${tds}</tr>`;
  }).join("")+(rows.length>shown.length?
    `<tr id="showMoreRow"><td colspan="${head.length}" style="text-align:center;padding:10px">
      <button class="mini" onclick="RENDER_CAP+=RENDER_STEP;renderTable()" style="font-weight:700">
        ⬇ Show ${Math.min(RENDER_STEP,rows.length-shown.length)} more (${rows.length-shown.length} remaining)</button></td></tr>`:"");
  $("#count").textContent=rows.length+" orders"+(rows.length>shown.length?` (showing ${shown.length})`:"");
  document.querySelectorAll("#tbl tbody tr[data-id]").forEach(tr=>tr.onclick=()=>openDw(tr.dataset.id));
  document.querySelectorAll("#tbl thead th").forEach(th=>th.onclick=()=>sortBy(th.dataset.c));
}
// Default: least-profit first, so the orders that need attention sit at the top.
// Sorting lives in renderTable via applySort, so the 30s live refresh never resets it.
let sortCol="profit_dollars",sortAsc=true;
function applySort(rows){
  if(!sortCol) return rows;
  const c=sortCol,dir=sortAsc?1:-1;
  return rows.sort((a,b)=>{
    let x=a[c],y=b[c];
    const bx=(x==null||x===""),by=(y==null||y==="");
    if(bx&&by) return 0;
    if(bx) return 1;   // blanks always sort last, either direction
    if(by) return -1;
    const nx=+x,ny=+y;
    if(!isNaN(nx)&&!isNaN(ny)){x=nx;y=ny;}else{x=""+x;y=""+y;}
    return (x<y?-1:x>y?1:0)*dir;
  });
}
function sortBy(c){
  if(c==="why"||c==="act")return;
  sortAsc=sortCol===c?!sortAsc:true; sortCol=c;
  renderTable();
}

// ── Row quick-actions (label without opening the drawer) ────────────────────
function actCell(o,sticky){
  const id=esc(o.amazon_order_id);
  const fc=o.flag_color||"";
  const dot=(c,lbl)=>`<span class="qflag" title="${lbl} flag" style="background:${c};${fc===c?'outline:2px solid var(--ink);outline-offset:1px':''}" onclick="event.stopPropagation();quickFlag('${id}','${c}')"></span>`;
  return `<td class="${sticky} actcell" onclick="event.stopPropagation()">`
    +`<a class="qsc" href="https://sellercentral.amazon.com/orders-v3/order/${id}" target="_blank" rel="noopener" title="Open in Seller Central">↗</a>`
    +dot('#b42318','Red')+dot('#eab308','Yellow')+dot('#067647','Green')
    +`<span class="qtag" title="Add / remove tag" onclick="event.stopPropagation();quickTagMenu('${id}',event)">🏷</span>`
    +`</td>`;
}
async function quickFlag(id,color){
  const o=ROWS.find(x=>x.amazon_order_id===id);
  const nc=(o&&o.flag_color===color)?"":color;   // click the same colour again = clear
  await api("/api/order_update",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({order_id:id,flag_color:nc})});
  if(o)o.flag_color=nc; renderTable();
}
function quickTagMenu(id,ev){
  ev.stopPropagation();
  let m=$("#qmenu"); if(!m){m=document.createElement("div");m.id="qmenu";document.body.appendChild(m);}
  const o=ROWS.find(x=>x.amazon_order_id===id)||{};
  const cur=tagList(o);
  m.innerHTML=TAGS_STD.map(t=>`<div class="qmi ${cur.includes(t)?'on':''}" onclick="quickTagSet('${esc(id)}','${esc(t)}')">${cur.includes(t)?'✓ ':'&nbsp;&nbsp;&nbsp;'}${esc(t)}</div>`).join("")
    +cur.filter(t=>!TAGS_STD.includes(t)).map(t=>`<div class="qmi on" onclick="quickTagSet('${esc(id)}','${esc(t)}')">✓ ${esc(t)}</div>`).join("")
    +`<div class="qmi" style="border-top:1px solid var(--line)" onclick="quickTagOther('${esc(id)}')">+ Other…</div>`;
  m.style.display="block";
  m.style.left=Math.min(ev.clientX,window.innerWidth-170)+"px";
  m.style.top=Math.min(ev.clientY+6,window.innerHeight-220)+"px";
}
function quickTagOther(id){const t=(prompt("Custom tag:")||"").trim(); if(t)quickTagSet(id,t); else closeQuickMenu();}
async function quickTagSet(id,tag){
  const o=ROWS.find(x=>x.amazon_order_id===id)||{amazon_order_id:id};
  const cur=tagList(o);
  const nxt=cur.includes(tag)?cur.filter(t=>t!==tag):cur.concat([tag]);
  await api("/api/order_update",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({order_id:id,tags:nxt.join(", ")})});
  o.tags=nxt.join(", "); renderTable(); closeQuickMenu();
}
function closeQuickMenu(){const m=$("#qmenu"); if(m)m.style.display="none";}
document.addEventListener("click",e=>{const m=$("#qmenu");
  if(m&&m.style.display==="block"&&!m.contains(e.target))closeQuickMenu();});

const GROUPS=[
  ["Amazon",["amazon_order_id","merchant_order_id","account","profile_name","order_status","order_label","asin","sku","title","quantity","is_business","item_price","shipping_price","earnings","amazon_fees","shipping_amt","purchase_date","placed_at","ship_by_date","deliver_by_date"]],
  ["Customer / address",["ship_name","ship_street","ship_city","ship_state","ship_postal_code","ship_country","ship_phone","customer_messaged","customer_message_text","customer_inquiry","feedback_rating","feedback_text"]],

async function openDw(oid){
  const r=await api("/api/order/"+encodeURIComponent(oid));
  const o=r.order||{}; const notes=r.notes||[]; const rets=r.returns||[];
  window._DWO=o;   // current drawer order (tag toggles read the live tag list from here)
  // ROI (profit/cost) — the metric your placer/Seller Note uses. Computed here, not stored,
  // so the placement gate logic is untouched. profit_percent stays gross margin (profit/sale).
  const _c=+o.zoro_order_total, _p=+o.profit_dollars;
  if(_c>0 && !isNaN(_p)) o.roi_percent=Math.round(_p/_c*1000)/10;
  const KLBL={profit_percent:"margin % (profit÷sale)", roi_percent:"ROI % (profit÷cost — placer note)"};
  // "Copy for boss" text — EXACTLY the seller-note format the placer writes on Amazon after
  // placing (utils/seller_notes.format_seller_note): Title budgeted to 256 chars, G→K masked
  // Code (+" - ALT"), TC/T/Earnings/PM/PP and the C-coupon line with the coupon's 3-letter tag.
  window._copyText=(()=>{
    const num=v=>(v==null||v==="")?null:(isNaN(+v)?null:+v);
    const tc=num(o.zoro_order_total), tax=num(o.zoro_tax), earn=num(o.earnings), pm=num(o.profit_dollars);
    const pp=(tc>0&&pm!=null)?(pm/tc*100):null;   // PP = ROI (profit÷cost) — same as the placer note
    const L=[`ASIN: ${o.asin||'N/A'}`];
    const askv=(""+(o.sku||"")).trim();
    if(askv&&askv!=="N/A"&&askv!=="None") L.push(`SKU: ${askv}`);
    let origCode=(""+(o.zoro_sku||"")).trim()||"N/A";
    let codeLine = `Zoro Code Used: ${origCode}`;
    if((o.alt_used||"")==="Yes") codeLine+=" - ALT";
    L.push(codeLine);
    L.push(`Qty: ${(o.quantity!=null&&o.quantity!=="")?o.quantity:'N/A'}`);
    L.push(`Tracking msg sent: ${o.tracking_id_uploaded?'Yes':'No'}`);
    L.push(tc!=null?`Total Zoro Cost: $${tc.toFixed(2)}`:`Total Zoro Cost: N/A`);
    L.push(tax!=null?`Zoro Tax: $${tax.toFixed(2)}`:`Zoro Tax: N/A`);
    L.push(earn!=null?`Amazon Earnings: $${earn.toFixed(2)}`:`Amazon Earnings: N/A`);
    L.push(pm!=null?`Profit Margin: $${pm.toFixed(2)}`:`Profit Margin: N/A`);
    L.push(pp!=null?`Profit Percentage: ${pp.toFixed(1)}%`:`Profit Percentage: N/A`);
    const cu=(""+(o.coupon_used||"")).trim();
    if(cu&&cu!=="None"&&cu!=="N/A"){
      const sfx=(cu.toUpperCase()!=="AUTO_APPLIED")?` - ${cu.slice(0,3).toUpperCase()}`:"";
      const off=num(o.coupon_savings);
      L.push(off?`Coupon: Used ( $${off.toFixed(2)} )${sfx}`:`Coupon: Used${sfx}`);
    }else L.push("Coupon: Not Used");
    
    let body=L.join("\n");
    const title=(""+(o.title||"")).trim();
    if(title&&title!=="N/A"&&title!=="None"){
      body=`Title: ${title.slice(0,30)}\n`+body;
    }
    body += "\n\nComments: ";
    return body;
  })();
  const grp=GROUPS.map(([t,ks])=>{
    const items=ks.filter(k=>o[k]!=null&&o[k]!=="").map(k=>`<b>${KLBL[k]||k}</b><span>${esc(fmt(k,o[k]))}</span>`).join("");
    return items?`<div class="sect">${t}</div><div class="kv">${items}</div>`:"";
  }).join("");
  // LIVE Gmail return/refund — shows even if no closing run has touched this order yet
  const refund=rets.find(x=>x.refund_done==="Yes");
  const retHtml = rets.length ? `<div class="alertbox ${refund?'rf':'rt'}">
      <b>${refund?'💸 Refund detected in Gmail — act now':'↩ Return activity in Gmail'}</b>`+
      rets.slice(0,4).map(x=>`<div>${esc((x.email_timestamp||'').slice(0,16))} — ${x.refund_done==='Yes'?('refund $'+(x.refund_amount||0)+(x.refund_date?(' · '+esc(x.refund_date)):'')):'return requested'} ${esc(x.return_reason||'')}</div>`).join("")+`</div>` : "";
  // messages + confirmations
  const msgHtml = `<div class="sect">Messages &amp; confirmations</div><div class="kv">`+
    [["tracking → Amazon", o.tracking_id_uploaded?("✓ "+o.tracking_id_uploaded):"—"],
     ["delivery message sent", o.delivered_msg_sent||"—"],
     ["review requested", o.review_request_sent||o.review_requested||"—"],
     ["customer messaged us", o.customer_messaged||"—"],
     ["customer inquiry", o.customer_inquiry||"—"]]
     .map(([k,v])=>`<b>${k}</b><span>${esc(v)}</span>`).join("")+`</div>`;
  const aLink = o.asin?`<a class="sclink" style="cursor:pointer" onclick="openAsin('${esc((''+o.asin).split(',')[0])}')">📈 ASIN insights</a>`:"";
  $("#dw").innerHTML=`
    <span class="close" onclick="closeDw()">×</span>
    <h2>${esc(o.amazon_order_id||oid)}</h2>
    <div class="sub"><span class="badge l-${esc(o.order_label)}">${esc(o.order_label)||""}</span> · ${esc(o.account)} · ${esc(o.title)}</div>
    <div class="actions"><a class="sclink" href="https://sellercentral.amazon.com/orders-v3/order/${esc(oid)}" target="_blank" rel="noopener">↗ Seller Central</a>${aLink}<button class="sclink" style="cursor:pointer" onclick="copyOrderText(this)">📋 Copy for boss</button></div>
    ${retHtml}
    <div class="actions"><span>Flag:</span>
      ${["#b42318","#eab308","#067647"].map(c=>`<button onclick="act('${oid}',{flag_color:'${c}'})" style="background:${c};width:22px;height:22px;border-radius:50%;padding:0"></button>`).join("")}
      <button onclick="act('${oid}',{flag_color:''})">clear</button></div>
    ${tagsRowHtml(oid,o)}
    <div class="actions"><span>Case:</span>
      <select onchange="act('${oid}',{case_status:this.value})">
        ${["","Open","Filed with Zoro","Won","Lost"].map(s=>`<option ${o.case_status===s?"selected":""}>${s}</option>`).join("")}
      </select>
      <label class="chk"><input type="checkbox" ${o.manual_delivered==="Yes"?"checked":""} onchange="act('${oid}',{manual_delivered:this.checked?'Yes':''})"> mark delivered</label></div>
    ${grp}
    <div id="dwzoro"></div>
    ${msgHtml}
    <div class="sect">Comments</div>
    <div id="notes">${notes.map(n=>`<div class="note">${esc(n.note)}<br><small>${esc(n.author||"me")} · ${esc((n.created_at||"").slice(0,16))}</small></div>`).join("")||'<div style="color:var(--muted);font-size:12px">No comments yet.</div>'}</div>
    <textarea id="newnote" placeholder="Add a comment / action note…"></textarea>
    <div class="actions"><button class="save" onclick="addNote('${oid}')">Add comment</button></div>`;
  $("#ov").style.display="block";
  renderDwZoro(o);   // async — one compact Zoro-catalog line under "Zoro / cost" (or nothing)
}

function copyOrderText(btn){
  const t=window._copyText||"";
  const done=()=>{const o=btn.textContent;btn.textContent="✓ Copied";setTimeout(()=>btn.textContent=o,1500);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t,done));}
  else fallbackCopy(t,done);
}
function fallbackCopy(t,done){
  const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done&&done();}catch(e){}document.body.removeChild(ta);
}

function changeLog(s){
  s=s||[];
  const ev=[];
  for(let i=0;i<s.length;i++){
    const d=s[i], pv=i>0?s[i-1]:null;
    if(d.price_changed && pv){
      const o=+pv.zoro_price||0, n=+d.zoro_price||0, pct=o?Math.round((n-o)/o*100):0;
      ev.push({date:d.date,kind:"price",sev:Math.abs(pct)>=10?"high":"med",
        txt:`Zoro cost <b>$${o.toFixed(2)} → $${n.toFixed(2)}</b> <b style="color:${n>=o?'var(--red)':'var(--green)'}">${pct>=0?'+':''}${pct}%</b> ${n>=o?'(margin squeeze)':'(cheaper — better margin)'}`});
    }
    if(d.code_changed && pv){
      ev.push({date:d.date,kind:"code",sev:"med",
        txt:`Zoro code <b>${esc(pv.zoro_code||'—')} → ${esc(d.zoro_code||'—')}</b> (supplier item changed)`});
    }
  }
  if(!ev.length) return '<div class="empty" style="padding:12px">No Zoro price or code changes in this window ✓</div>';
  ev.reverse();
  return `<div style="border:1px solid var(--line);border-radius:8px;overflow:hidden">`+
    ev.map(e=>`<div class="irow"><span class="sev ${e.sev}"></span>
      <span style="min-width:54px;font-weight:700">${esc((e.date||'').slice(5))}</span>
      <span class="catbadge" style="background:${e.kind==='price'?'#f3eefe':'#fdf0e6'};color:${e.kind==='price'?'#6941c6':'#b54708'}">${e.kind==='price'?'PRICE':'CODE'}</span>
      <span class="msg">${e.txt}</span></div>`).join("")+`</div>`;
}
function timeChart(s){
  if(!s.length) return '<div class="empty">No data</div>';
  ASIN_SERIES=s;
  const W=860,H=320,padL=48,padR=54,padT=22,padB=42,iw=W-padL-padR,ih=H-padT-padB,n=s.length;
  const maxU=Math.max(1,...s.map(d=>d.units||0));
  const maxD=Math.max(1,...s.flatMap(d=>[d.zoro_price||0,d.profit||0]));
  const X=i=> padL+(n===1?iw/2:iw*i/(n-1));
  const yU=v=> padT+ih-ih*((v||0)/maxU);
  const yD=v=> padT+ih-ih*((v||0)/maxD);
  ASIN_GEO={W,padT,ih,xs:s.map((_,i)=>X(i))};
  const bw=Math.max(2,Math.min(24,iw/n*0.55));
  const bars=s.map((d,i)=>`<rect x="${(X(i)-bw/2).toFixed(1)}" y="${yU(d.units).toFixed(1)}" width="${bw.toFixed(1)}" height="${(padT+ih-yU(d.units)).toFixed(1)}" rx="1.5" fill="#cdd9f5"/>`).join("");
  const polP=s.map((d,i)=>`${X(i).toFixed(1)},${yD(d.zoro_price).toFixed(1)}`).join(" ");
  const polR=s.map((d,i)=>`${X(i).toFixed(1)},${yD(d.profit).toFixed(1)}`).join(" ");
  const priceDots=s.map((d,i)=> d.price_changed?`<circle cx="${X(i).toFixed(1)}" cy="${yD(d.zoro_price).toFixed(1)}" r="4.5" fill="#6941c6" stroke="#fff" stroke-width="1.5"/>`:"").join("");
  const codeMarks=s.map((d,i)=> d.code_changed?`<line x1="${X(i).toFixed(1)}" y1="${padT}" x2="${X(i).toFixed(1)}" y2="${padT+ih}" stroke="#b54708" stroke-width="1.5" stroke-dasharray="4,3"/><text x="${X(i).toFixed(1)}" y="${(padT-4).toFixed(1)}" font-size="8" text-anchor="middle" fill="#b54708" font-weight="700">code</text>`:"").join("");
  // label each price-change point with the NEW $/unit so the chart reads on its own
  const priceLabels=s.map((d,i)=> d.price_changed?`<text x="${X(i).toFixed(1)}" y="${(yD(d.zoro_price)-9).toFixed(1)}" font-size="8.5" text-anchor="middle" fill="#6941c6" font-weight="700">$${(d.zoro_price||0).toFixed(2)}</text>`:"").join("");
  const step=Math.max(1,Math.ceil(n/9));
  const xl=s.map((d,i)=> i%step===0?`<text x="${X(i).toFixed(1)}" y="${H-16}" font-size="9" text-anchor="middle" fill="#667">${esc((d.date||'').slice(5))}</text>`:"").join("");
  const grid=`<line x1="${padL}" y1="${padT+ih}" x2="${padL+iw}" y2="${padT+ih}" stroke="#cfd6e4"/>`+
    [0,.5,1].map(f=>`<line x1="${padL}" y1="${(padT+ih-ih*f).toFixed(1)}" x2="${padL+iw}" y2="${(padT+ih-ih*f).toFixed(1)}" stroke="#eef1f6"/>`).join("");
  const yax=`<text x="6" y="${padT+8}" font-size="9" fill="#667">${maxU}u</text>
             <text x="${W-padR+6}" y="${padT+8}" font-size="9" fill="#3b5bdb">$${maxD.toFixed(0)}</text>
             <text x="${W-padR+6}" y="${padT+ih}" font-size="9" fill="#667">$0</text>`;
  return `<div style="position:relative">
    <svg id="asinsvg" viewBox="0 0 ${W} ${H}" width="100%">
      ${grid}
      <g class="g-units">${bars}</g>
      <g class="g-profit"><polyline points="${polR}" fill="none" stroke="#067647" stroke-width="2"/></g>
      <g class="g-price"><polyline points="${polP}" fill="none" stroke="#3b5bdb" stroke-width="2"/>${priceDots}${priceLabels}</g>
      ${codeMarks}${xl}${yax}
      <line id="asinguide" x1="0" y1="${padT}" x2="0" y2="${padT+ih}" stroke="#98a2b3" stroke-dasharray="3,3" style="display:none"/>
      <rect id="asinhit" x="${padL}" y="${padT}" width="${iw}" height="${ih}" fill="transparent" style="cursor:crosshair"/>
    </svg>
    <div id="asintip" class="charttip" style="display:none"></div>
  </div>`;
}

function wireAsinHover(){
  const svg=$("#asinsvg"), hit=$("#asinhit"), tip=$("#asintip"), guide=$("#asinguide");
  if(!svg||!hit||!ASIN_GEO) return;
  const wrap=svg.parentElement;
  hit.addEventListener("mousemove",e=>{
    const rb=svg.getBoundingClientRect(), sx=(e.clientX-rb.left)/rb.width*ASIN_GEO.W;
    let bi=0,bd=1e9; ASIN_GEO.xs.forEach((xx,i)=>{const dd=Math.abs(xx-sx);if(dd<bd){bd=dd;bi=i;}});
    const d=ASIN_SERIES[bi]; if(!d) return;
    const gx=ASIN_GEO.xs[bi];
    guide.setAttribute("x1",gx); guide.setAttribute("x2",gx); guide.style.display="";
    const wr=wrap.getBoundingClientRect(), px=e.clientX-wr.left, py=e.clientY-wr.top;
    tip.style.display="block";
    tip.style.left=Math.max(0,Math.min(wrap.clientWidth-172,px+12))+"px";
    tip.style.top=Math.max(0,py-10)+"px";
    tip.innerHTML=`<b>${esc(d.date)}</b><br>units: ${d.units}<br>Zoro $/unit: $${(d.zoro_price||0).toFixed(2)}<br>profit/unit: $${(d.profit||0).toFixed(2)}<br>margin: ${d.margin}%<br>code: ${esc(d.zoro_code||'—')}`
      +(d.code_changed?'<br><span class="ch">⟵ code changed</span>':'')+(d.price_changed?'<br><span class="ch">⚠ price changed</span>':'');
  });
  hit.addEventListener("mouseleave",()=>{tip.style.display="none";guide.style.display="none";});
}
function asinOrders(rows){

function filterSkus(){
  const val = (document.getElementById('skuFilter')||{}).value;
  const prefix = (val||"").toLowerCase();
  const trs = document.querySelectorAll("#listings tbody tr");
  let vis = 0;
  trs.forEach(tr => {
    if(tr.cells.length < 2) return;
    const skuTd = tr.cells[1];
    if(skuTd){
      const sku = skuTd.innerText.trim().toLowerCase();
      if(sku.startsWith(prefix)){
        tr.style.display = "";
        if(tr.cells.length > 5) vis++;
      } else {
        tr.style.display = "none";
      }
    }
  });

  if(cnt) cnt.innerText = vis.toLocaleString();

function renderTracker(){
  const all=(window._TRK&&window._TRK.items)||[];
  let items=TRK_FLAG?all.filter(x=>(x.flag||"")===TRK_FLAG):all;
  if(TRK_TAG) items=items.filter(x=>tagList(x).includes(TRK_TAG));
  const fc=c=>c?`<span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${esc(c)};vertical-align:middle"></span>`:'';
  const flags={"#b42318":"🔴 Red (urgent)","#eab308":"🟡 Yellow","#067647":"🟢 Green"};
  const cnt=col=>all.filter(x=>(x.flag||"")===col).length;
  const chip=(col,lbl)=>`<span onclick="TRK_FLAG=(TRK_FLAG==='${col}'?'':'${col}');renderTracker()" style="cursor:pointer;padding:5px 11px;border-radius:8px;font-weight:600;font-size:12px;border:1px solid var(--line);${TRK_FLAG===col?'background:var(--accsoft);border-color:var(--accent)':'background:#fff'}">${lbl}${col?(' ('+cnt(col)+')'):(' ('+all.length+')')}</span>`;
  // Tag filter chips — every tag in use (standard AND custom), with counts
  const allTags=[...new Set(all.flatMap(x=>tagList(x)))].sort();
  const tcnt=t=>all.filter(x=>tagList(x).includes(t)).length;
  const tchip=t=>`<span onclick="TRK_TAG=(TRK_TAG==='${esc(t)}'?'':'${esc(t)}');renderTracker()" style="cursor:pointer;padding:5px 11px;border-radius:20px;font-weight:600;font-size:12px;border:1px solid ${TRK_TAG===t?'var(--accent)':'var(--line)'};${TRK_TAG===t?'background:var(--accsoft);color:var(--accent)':'background:#fff'}">🏷 ${esc(t)} (${tcnt(t)})</span>`;
  const tagbar=allTags.length?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px">${allTags.map(tchip).join("")}</div>`:"";
  // activity time = latest of CRM change (flag/label/tag/status) and last comment; stored as UTC
  const actTs=x=>{const a=x.updated_at||"",b=x.last_note_at||"";return a>b?a:b;};
  const actLoc=x=>{const t=actTs(x);return t?new Date(t.replace(" ","T")+"Z"):null;};
  const dkey=d=>d?(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")):"";
  const row=x=>{const d=actLoc(x);return `<tr>
    <td>${fc(x.flag)}</td>
    <td><span class="asinlink" onclick="openZoro('${esc(x.id)}')">${esc(x.id)}</span></td>
    <td>${esc(x.account||'')}</td>
    <td>${esc(x.label||'')}</td>
    <td>${tagList(x).map(t=>`<span class="tagchip">${esc(t)}</span>`).join("")}</td>
    <td>${esc(x.case_status||'')}</td>
    <td>${x.reminder_at?('⏰ '+esc(x.reminder_at.slice(0,10))):''}${x.reminder_note?(' '+esc(x.reminder_note)):''}</td>
    <td>${x.notes?('💬 '+x.notes):''}${x.last_note?(' · '+esc((''+x.last_note).slice(0,70))):''}</td>
    <td style="white-space:nowrap;color:var(--muted)">${d?(TRK_GROUP?d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):d.toLocaleDateString([],{day:"2-digit",month:"short"})+" "+d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})):''}</td>
  </tr>`;};
  let body="";
  if(TRK_GROUP){
    const groups={};
    items.forEach(x=>{const k=dkey(actLoc(x));(groups[k]=groups[k]||[]).push(x);});
    const keys=Object.keys(groups).sort().reverse();   // newest day first; "" (no date) lands last
    const today=dkey(new Date()), yest=dkey(new Date(Date.now()-864e5));
    body=keys.map(k=>{
      const g=groups[k]; g.sort((a,b)=>actTs(a)>actTs(b)?-1:1);
      const d=k?new Date(k+"T00:00:00"):null;
      const full=d?d.toLocaleDateString([],{weekday:"short",day:"2-digit",month:"short",year:"numeric"}):"";
      const nice=!k?"Earlier — no date recorded":(k===today?("Today · "+full):(k===yest?("Yesterday · "+full):full));
      return `<tr><td colspan=9 style="background:var(--accsoft);font-weight:700;font-size:12px;padding:8px 10px;border-top:2px solid var(--accent)">📅 ${nice} — ${g.length} item${g.length===1?"":"s"}</td></tr>`+g.map(row).join("");
    }).join("");
  } else body=items.map(row).join("");
  const gchip=`<span onclick="TRK_GROUP=!TRK_GROUP;renderTracker()" style="cursor:pointer;padding:5px 11px;border-radius:8px;font-weight:600;font-size:12px;border:1px solid ${TRK_GROUP?'var(--accent)':'var(--line)'};${TRK_GROUP?'background:var(--accsoft);color:var(--accent)':'background:#fff'}">📅 Group by date</span>`;
  $("#tracker").innerHTML=`<div style="padding:14px 2px">
    <div class="sect">📌 Tracker / diary — ${items.length} item${items.length===1?'':'s'}${(TRK_FLAG||TRK_TAG)?' (filtered)':''}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 6px">
      ${chip("","All")} ${chip("#b42318",flags["#b42318"])} ${chip("#eab308",flags["#eab308"])} ${chip("#067647",flags["#067647"])} ${gchip}</div>
    ${tagbar}
    <div style="font-size:11px;color:var(--muted);margin-bottom:8px">${TRK_GROUP?'Grouped by day of last activity (label/flag/tag/status/comment), newest day first.':'Follow-ups (⏰) first.'} Everything you flagged, tagged, set a status/follow-up on, or commented. Click a flag or 🏷 tag chip to filter; click any row to open & update.</div>
    <table style="font-size:12px"><thead><tr><th></th><th>order / WB</th><th>acct</th><th>label</th><th>tags</th><th>status</th><th>follow-up</th><th>comments</th><th>${TRK_GROUP?'time':'when'}</th></tr></thead>
    <tbody>${body||'<tr><td colspan=9 style="color:var(--muted);padding:14px">Nothing here — flag, tag, comment, or set a follow-up on any order/WB (via ⚠ Severe or any order drawer).</td></tr>'}</tbody></table></div>`;
}
let SEV_FILT="";
async function loadSevere(){
  const p=new URLSearchParams();
  if($("#account").value)p.set("account",$("#account").value);
  if(DATE_FROM)p.set("from",DATE_FROM); if(DATE_TO)p.set("to",DATE_TO);
  window._SEV=await api("/api/severe?"+p.toString()).catch(()=>({}));
  renderSevere();
}
function renderSevere(){
  const r=window._SEV||{};
  const pc=r.placed_not_captured||{count:0,exposure:0,items:[]};
  const nr=r.refund_no_return||{count:0,open:0,exposure:0,items:[]};
  const rl=r.refund_loss||{count:0,open:0,exposure:0,items:[]};
  const sel=k=>SEV_FILT===k;
  const card=(k,lbl,big,sub,color)=>`<div onclick="SEV_FILT=(SEV_FILT==='${k}'?'':'${k}');renderSevere()" title="click to filter"
    style="cursor:pointer;flex:1;min-width:210px;background:var(--card);border-radius:11px;box-shadow:var(--shadow);padding:13px 15px;border-left:5px solid ${color};outline:${sel(k)?'2px solid '+color:'none'}">
    <div style="font-size:12px;color:var(--muted)">${lbl}</div><div style="font-size:25px;font-weight:800">${big}</div><div style="font-size:13px;color:${color};font-weight:700">${sub}</div></div>`;
  const opts=["","Open","Resolved","Filed with Zoro","Ignored"];
  const ball=c=>c?`<span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:${esc(c)};vertical-align:middle"></span>`:'';
  const rt=items=>`<table style="font-size:12px"><thead><tr><th></th><th>order</th><th style="text-align:right">refund $</th><th style="text-align:right">net profit</th><th>reason</th><th>ASIN</th><th>resolve</th><th></th></tr></thead><tbody>${(items||[]).map(x=>`<tr style="${x.resolved?'opacity:.4':''}">
    <td>${x.flag?ball(x.flag):(x.resolved?'✓':'🔴')}</td>
    <td><span class="asinlink" onclick="openZoro('${esc(x.order_id)}')" title="show Zoro order details">${esc(x.order_id)}</span></td>
    <td style="text-align:right;font-weight:700">${usd(x.refund_amount)}</td>
    <td style="text-align:right;color:${(x.net_profit_after_refund||0)<0?'#b42318':'inherit'}">${x.net_profit_after_refund==null?'':usd(x.net_profit_after_refund)}</td>
    <td>${esc(x.return_reason||'')}</td>
    <td>${x.asin?`<span class="asinlink" onclick="openAsin('${esc(x.asin)}')">${esc(x.asin)}</span>`:''}</td>
    <td><select onchange="act('${esc(x.order_id)}',{case_status:this.value})">${opts.map(o=>`<option ${x.case_status===o?'selected':''}>${o}</option>`).join("")}</select></td>
    <td><a class="sclink" href="https://sellercentral.amazon.com/orders-v3/order/${esc(x.order_id)}" target="_blank" rel="noopener">SC↗</a></td></tr>`).join("")||`<tr><td colspan=8 style="color:var(--muted);padding:10px">none 🎉</td></tr>`}</tbody></table>`;
  const csv="data:text/csv;charset=utf-8,wb,amount%0A"+(pc.items||[]).map(x=>x.wb+","+x.amount).join("%0A");
  const show=k=>!SEV_FILT||SEV_FILT===k;
  const popts=["","Open","Resolved","Filed with Zoro","Ignored"];
  const placedSec=`<div class="sect">🧾 Zoro orders placed + paid but never captured — May 2026 onwards (${pc.count} open${pc.total?(' / '+pc.total):''}) ${pc.total?`&nbsp;<a class="sclink" href="${csv}" download="placed_not_captured.csv">⬇ CSV</a>`:""}</div>
    <div style="font-size:11px;color:var(--muted);margin:2px 0 6px">Click a WB for its Zoro receipt. Set a status to resolve (saved). No Amazon order links these — investigate at Zoro (cancel/return) or find the missing order.</div>
    <table style="font-size:12px;max-width:640px"><thead><tr><th></th><th>WB</th><th style="text-align:right">Zoro $</th><th>resolve</th></tr></thead><tbody>${(pc.items||[]).slice(0,400).map(x=>`<tr style="${x.resolved?'opacity:.4':''}">
      <td>${x.flag?ball(x.flag):(x.resolved?'✓':'🔴')}</td>
      <td><span class="asinlink" onclick="openZoro('${esc(x.wb)}')">${esc(x.wb)}</span></td>
      <td style="text-align:right;font-weight:600">${usd(x.amount)}</td>
      <td><select onchange="act('${esc(x.wb)}',{case_status:this.value})">${popts.map(o=>`<option ${x.case_status===o?'selected':''}>${o}</option>`).join("")}</select></td></tr>`).join("")||`<tr><td colspan=4 style="color:var(--muted)">none 🎉</td></tr>`}</tbody></table>`;
  $("#severe").innerHTML=`<div style="padding:14px 2px">
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:6px">
      ${card("placed","🧾 Placed but NOT captured",pc.count+" open",usd(pc.exposure)+" untracked","#b42318")}
      ${card("norr","↩️ Refund, NO return request",nr.open+" open",usd(nr.exposure),"#b42318")}
      ${card("loss","📉 Refund losses (net&lt;0)",rl.open+" open",usd(rl.exposure)+" lost","#b54708")}
    </div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:10px">${SEV_FILT?`Filtered: <b>${esc(SEV_FILT)}</b> — click the active card again to show all. Click any order/WB for full Zoro details.`:"Click a card to filter · click any order/WB for full Zoro details."}</div>
    ${show('placed')?placedSec:""}
    ${show('norr')?`<div class="sect" style="margin-top:20px">↩️ Refunds with NO return request (${nr.count}) — money out, no return filed</div>${rt(nr.items)}`:""}
    ${show('loss')?`<div class="sect" style="margin-top:20px">📉 Refund losses — net profit after refund is negative (${rl.count})</div>${rt(rl.items)}`:""}
    <div class="sect" style="margin-top:24px">💸 Refund issues — timing tickets (was its own tab)</div>
    <div id="refunds"></div>
  </div>`;
  loadRefundIssues();   // renders into the nested #refunds div above
}
function quickNote(txt){
  const el=$("#znote");
  if(!el)return;
  const cur=el.value.trim();
  el.value = cur ? (cur + " · " + txt) : txt;
  el.focus();
}

  $("#zdw").innerHTML=`<span class="close" onclick="closeZoro()">×</span>${head}${summary}
    <div class="zcard" style="margin-bottom:12px">

  // latest paid Zoro $/unit per code (series is date-sorted) → early price-drift warning

  s.forEach(d=>{const c=(""+(d.zoro_code||"")).trim().toUpperCase();if(c&&+d.zoro_price>0)paid[c]=+d.zoro_price;});

async function loadInsights(){
  const p=new URLSearchParams();
  if($("#account").value)p.set("account",$("#account").value);
  if(DATE_FROM) p.set("from",DATE_FROM);
  if(DATE_TO) p.set("to",DATE_TO);
  // every call is guarded — one failing endpoint (e.g. a stale server missing a new
  // route, or a transient DB lock during a closing run) must NEVER blank the whole tab.
  let insErr=null;
  const r=await api("/api/insights?"+p.toString()).catch(e=>{insErr=e;return{insights:{}};});
  const w=await api("/api/watch").catch(()=>({watch:[]}));
  const sp=await api("/api/ship_perf?"+p.toString()).catch(()=>({days:[]}));
  const hp=await api("/api/handling?"+p.toString()).catch(()=>({asins:[],summary:{}}));
  const ins=(r&&r.insights)||{};
  let items=[];
  for(const k of Object.keys(INAMES)) (ins[k]||[]).forEach(a=>items.push(Object.assign({cat:k},a)));
  if(ICAT) items=items.filter(a=>a.cat===ICAT);
  const high=items.filter(a=>a.severity==="high").length;
  const days=new Set(items.map(a=>a.date||"(undated)"));
  $("#kpis").innerHTML=[["Changes",items.length],["High priority",high],["Days",days.size]]
    .map(([l,v],i)=>`<div class="kpi k${i}"><div class="kv-num">${v}</div><div class="kv-lab">${l}</div></div>`).join("");
  const byDay={}; items.forEach(a=>{const d=a.date||"(undated)";(byDay[d]=byDay[d]||[]).push(a);});
  const ds=Object.keys(byDay).sort().reverse();
  const h=ds.map(d=>`<div class="igrp"><h3><span>${esc(d)}</span><span>${byDay[d].length} change(s)</span></h3>`+
    byDay[d].map(a=>`<div class="irow"><span class="sev ${a.severity||'med'}"></span>
      <span class="catbadge">${INAMES[a.cat]}</span>
      ${a.link==='asin'&&a.asin?`<span class="oid" onclick="openAsin('${esc(a.asin)}')">${esc(a.asin)} ↗</span>`:`<span class="oid" onclick="openDw('${esc(a.order_id)}')">${esc(a.order_id)}</span>`}
      <span class="msg">${esc(a.message||"")}</span>
      <button class="mini" onclick="resolve('${a.cat}','${esc(a.ref_key)}',this)">Resolve</button></div>`).join("")+`</div>`).join("");
  const errBanner=insErr?`<div class="igrp"><div class="irow" style="color:var(--red);font-weight:600">⚠ Insights failed to load (server busy, locked, or running older code — restart the dashboard server). Shipping &amp; handling panels still shown below.</div></div>`:'';
  const body=items.length?h:(insErr?'':'<div class="empty" style="padding:24px">No order changes 🎉</div>');
  // When a specific category is picked, show ONLY that category's items — the
  // always-on shipping/handling/watch panels would otherwise sit on top and make
  // the filter look like it did nothing. Show the panels only in the "All" view.
  const panels=ICAT?'':(shipPanel(sp.days||[])+handlingPanel(hp)+watchPanel(w.watch||[]));
  const catNote=ICAT?`<div class="irow" style="color:var(--muted);font-size:12px;padding:4px 0">Filtered to <b>${esc(INAMES[ICAT]||ICAT)}</b> · ${items.length} item(s) — pick “All categories” to see the shipping &amp; handling panels.</div>`:'';
  $("#insights").innerHTML=errBanner+panels+catNote+body;
  $("#count").textContent=items.length+" changes";
}
function shipPanel(days){
  days=days||[];
  if(!days.length) return '';
  // running totals for the combined footer (the owner's 124+29 / 145+127 = % view)
  let T={placed:0,must:0,relaxed:0,early:0,pending:0};
  const rowFor=(d,bold)=>{
    const placed=d.placed||0, must=d.must_ship||0, relaxed=d.relaxed||0,
          early=d.shipped_early||0, pending=d.relaxed_pending||0;
    const rate=relaxed?Math.round(early/relaxed*100):0;
    const key=bold?'all':esc(d.day);
    const lbl=bold?'<b>ALL ('+(days.length)+' days)</b>':`<span style="min-width:90px;font-weight:600">${esc(d.day)}</span>`;
    const earlyClick=early?`onclick="openShipDay('${key}')" style="color:var(--green);font-weight:700;cursor:pointer;text-decoration:underline"`
                          :`style="color:var(--green);font-weight:700"`;
    const rateCol=relaxed?`<span ${early?`onclick="openShipDay('${key}')" style="cursor:pointer;"`:''} style="font-weight:800;color:var(--green)">${rate}% early</span>`
                         :`<span style="color:var(--muted);font-weight:700">— no buffer</span>`;
    return `<div class="irow"${bold?' style="border-top:2px solid var(--line);font-weight:700;background:var(--card2,#f7f9fc)"':''}>
      <span style="min-width:90px">${lbl}</span>
      <span class="msg">placed <b>${placed}</b> &nbsp;·&nbsp; must-ship <span title="ship-by IS the deadline — obligated, not early">${must}</span> &nbsp;·&nbsp; <span style="font-weight:700" title="had a later ship-by = buffer">buffer ${relaxed}</span> &nbsp;→&nbsp; <span ${earlyClick} title="click to see these orders">shipped early ${early}${early?' ↗':''}</span>${pending?` &nbsp;·&nbsp; <span style="color:var(--muted)">pending ${pending}</span>`:''}</span>
      ${rateCol}</div>`;
  };
  const rows=days.map(d=>{
    T.placed+=d.placed||0; T.must+=d.must_ship||0; T.relaxed+=d.relaxed||0;
    T.early+=d.shipped_early||0; T.pending+=d.relaxed_pending||0;
    return rowFor(d,false);
  }).join("");
  const footer=rowFor({placed:T.placed,must_ship:T.must,relaxed:T.relaxed,
                       shipped_early:T.early,relaxed_pending:T.pending}, true);
  return `<div class="igrp"><h3><span>🚚 Shipped-early — by placement day (PKT)</span><span>${days.length} days</span></h3>
    <div class="irow" style="color:var(--muted);font-size:11px">Rate = shipped-early ÷ buffer orders. <b>buffer</b> = ship-by later than the day's deadline (we could've shipped later but didn't have to). <b>must-ship</b> = ship-by IS the deadline (obligated → excluded from rate). Live from placer ship-by + shipped-email, PKT→Pacific corrected.</div>
    ${rows}${days.length>1?footer:''}</div>`;
}

let CHAT_OPEN=false,CHAT_MAXID=0,CHAT_SEEN=+(localStorage.getItem("chatSeen")||0),CHAT_MSGS=[],CHAT_FILE=null;
function toggleChat(open){CHAT_OPEN=open===undefined?!CHAT_OPEN:open;
  $("#chatPanel").style.display=CHAT_OPEN?"flex":"none";
  if(CHAT_OPEN){markChatSeen();renderChat();scrollChat();$("#chatText").focus();}}

function markChatSeen(){CHAT_SEEN=Math.max(CHAT_SEEN,CHAT_MAXID);localStorage.setItem("chatSeen",CHAT_SEEN);updChatBadge();}

function chatMediaHtml(m){

  if(t.startsWith("video/"))return `<video src="${u}" controls style="max-width:235px;border-radius:8px;margin-top:4px"></video>`;

function renderChat(){

// ═══════════ Reminder Center (Microsoft-To-Do style shared tasks) ═══════════
let REMS=[];
function remNow(){const d=new Date(),p=n=>(""+n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function remDueCls(r){if(!r.due_at)return "";const now=remNow(),d=(""+r.due_at).slice(0,16).replace("T"," ");
  if(d<now)return "over";if(d.slice(0,10)===now.slice(0,10))return "today";return "";}
async function loadReminders(){
  if(window.ROLE!=="admin"){REMS=[];return;}   // reminders are owner-only (server 403s viewers)
  try{const r=await api("/api/reminders");REMS=r.reminders||[];}catch(e){REMS=[];}
  if(TAB==="reminders")renderReminders();updRemBadge();checkDueAlerts();}

// ── Due-time alerts: toast inside the dashboard + OS notification where allowed ──
function toast(title,body,onclick){
  const t=document.createElement("div");t.className="toast";
  t.innerHTML=`<b>${esc(title)}</b>${body?`<div style="margin-top:2px">${esc(body)}</div>`:""}`;
  t.onclick=()=>{if(onclick)onclick();t.remove();};
  $("#toasts").appendChild(t);setTimeout(()=>t.remove(),12000);}
function remBellChip(){
  if(!("Notification" in window))
    return `<span class="rmchip" title="This browser blocks OS pop-ups on plain http — in-dashboard alerts still fire here">🔔 in-dashboard alerts on</span>`;
  const s=Notification.permission;
  if(s==="granted")return `<span class="rmchip" title="OS pop-up fires when a reminder hits its due time (keep this tab open)">🔔 desktop alerts on</span>`;
  if(s==="denied")return `<span class="rmchip" title="Notifications are blocked for this site in browser settings — in-dashboard alerts still fire">🔕 desktop blocked</span>`;
  return `<span class="rmchip" style="cursor:pointer;background:#e7ecfd;font-weight:700" title="Allow OS pop-ups when a reminder is due"
    onclick="Notification.requestPermission().then(()=>renderReminders())">🔕 enable desktop alerts</span>`;}
function checkDueAlerts(){
  let seen={};try{seen=JSON.parse(localStorage.getItem("remNotified")||"{}");}catch(e){}
  const now=remNow();let dirty=false;
  REMS.filter(r=>!r.done&&r.due_at).forEach(r=>{
    const due=(""+r.due_at).slice(0,16).replace("T"," ");
    if(due<=now&&seen[r.id]!==due){          // fire ONCE per reminder per due-time (re-fires if due edited)
      seen[r.id]=due;dirty=true;
      const who=r.assignee&&r.assignee!==PROFILE?` (for ${r.assignee})`:"";
      toast("⏰ Reminder due"+who,`${r.title} — ${due}`,()=>setTab("reminders"));
      try{if(("Notification" in window)&&Notification.permission==="granted")
        new Notification("⏰ Reminder: "+r.title,{body:(r.assignee?("👤 "+r.assignee+" · "):"")+"due "+due,tag:"rem"+r.id});}catch(e){}
    }});
  Object.keys(seen).forEach(id=>{if(!REMS.some(r=>""+r.id===id&&!r.done)){delete seen[id];dirty=true;}});
  if(dirty)localStorage.setItem("remNotified",JSON.stringify(seen));}
function updRemBadge(){const n=REMS.filter(r=>!r.done&&remDueCls(r)).length,b=$("#remBadge");
  if(b){b.style.display=n?"inline":"none";b.textContent=n;}}
function renderReminders(){
  const names=[...new Set([PROFILE,...REMS.map(r=>r.assignee),...REMS.map(r=>r.created_by)].filter(Boolean))];
  const pending=REMS.filter(r=>!r.done),done=REMS.filter(r=>r.done);
  const row=r=>{const cls=r.done?"":remDueCls(r);
    return `<div class="remrow ${r.done?'done':''}">
      <span class="remchk ${r.done?'on':''}" title="${r.done?'mark as not done':'mark as done'}" onclick="remToggle(${r.id},${r.done?0:1})">${r.done?"✓":""}</span>
      <span style="flex:1;min-width:0">
        <div class="remtitle">${esc(r.title)}</div>
        ${r.notes?`<div class="remnotes">${esc(r.notes)}</div>`:""}
        <div class="remmeta">${r.assignee?`<span class="rmchip">👤 ${esc(r.assignee)}</span>`:""}
          ${r.due_at?`<span class="rmchip due ${cls}">⏰ ${esc((""+r.due_at).slice(0,16).replace("T"," "))}${cls==="over"?" · OVERDUE":cls==="today"?" · today":""}</span>`:""}
          <span class="rmchip" title="created ${esc(r.created_at||'')}">by ${esc(r.created_by||"?")}</span>
          ${r.done?`<span class="rmchip">✓ ${esc((r.done_at||"").slice(5,16))}${r.done_by?" by "+esc(r.done_by):""}</span>`:""}</div>
      </span>
      <span class="remact" title="edit due date" onclick="remEditDue(${r.id})">📅</span>
      <span class="remact" style="color:#b42318" title="delete" onclick="remDel(${r.id})">🗑</span>
    </div>`;};
  $("#reminders").innerHTML=`<div class="rembox">
    <h2 style="margin:8px 2px 12px">⏰ Reminder Center &nbsp;${remBellChip()}</h2>
    <div class="remadd">
      <input id="remTitle" placeholder="Add a task / reminder… (Enter to add)">
      <input id="remDue" type="datetime-local" title="due date (optional)">
      <input id="remWho" list="remNames" placeholder="assign to…" style="width:120px">
      <datalist id="remNames">${names.map(n=>`<option>${esc(n)}</option>`).join("")}</datalist>
      <button class="ghost" id="remAddBtn" style="font-weight:700">➕ Add</button>
    </div>
    ${pending.length?pending.map(row).join(""):'<div style="color:var(--muted);padding:26px;text-align:center">Nothing pending 🎉</div>'}
    ${done.length?`<div style="margin:18px 2px 4px;color:var(--muted);font-size:12px;font-weight:800">COMPLETED (${done.length})</div>`+done.slice(0,50).map(row).join(""):""}
  </div>`;
  $("#remAddBtn").onclick=remAdd;
  $("#remTitle").addEventListener("keydown",e=>{if(e.key==="Enter")remAdd();});}
async function remAdd(){
  const t=$("#remTitle").value.trim();if(!t)return;
  // adding a task is a user gesture — the right moment to ask for OS notification permission
  try{if(("Notification" in window)&&Notification.permission==="default")
    Notification.requestPermission().then(()=>{if(TAB==="reminders")renderReminders();});}catch(e){}
  await api("/api/reminder",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({title:t,due_at:($("#remDue").value||"").replace("T"," "),
      assignee:$("#remWho").value.trim(),created_by:ensureProfile()})});
  loadReminders();}
async function remToggle(id,done){
  await api("/api/reminder_update",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id,done,done_by:ensureProfile()})});
  loadReminders();}
async function remEditDue(id){const r=REMS.find(x=>x.id===id);if(!r)return;
  const v=prompt("Due (YYYY-MM-DD HH:MM — empty for none):",(r.due_at||"").slice(0,16).replace("T"," "));
  if(v===null)return;
  await api("/api/reminder_update",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,due_at:v.trim()})});
  loadReminders();}
async function remDel(id){if(!confirm("Delete this reminder?"))return;
  await api("/api/reminder_update",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,delete:1})});
  loadReminders();}
setInterval(loadReminders,60000);loadReminders();

    $R.innerHTML = `
      <div style="padding:60px 20px;text-align:center;color:var(--muted);font-family:'Montserrat',sans-serif">

      </div>`;
  }

    const res = await api(`/api/repricer?account=${encodeURIComponent(REPRICER_ACCOUNT)}`);

    // Check if background scraping is running and auto-poll

async function triggerRepricerScrape(){
  const confirmed = confirm(
    `🚀 Start Live Amazon Competitor Scraping for ${REPRICER_ACCOUNT}?\n\n` +
    `• Undetected Chrome will launch in the background.\n` +
    `• Scrapes live Buy Box, Lowest 1, 2, 3 sellers & prices across all ${REPRICER_ACCOUNT} listings.\n` +
    `• The Repricer tab will update live and automatically generate the updated Excel (.xlsx) report.`
  );
  if(!confirmed) return;

  try {
    const res = await api(`/api/repricer_scrape?account=${encodeURIComponent(REPRICER_ACCOUNT)}`);
    toast("⚡ Scraper Started", res.message || `Background scraper running for ${REPRICER_ACCOUNT}`);
    loadRepricer(true);
  } catch(e) {
    alert("Could not start scraper: " + (e.message||e));
  }
}

  window.open(`/api/repricer_excel?account=${encodeURIComponent(REPRICER_ACCOUNT)}`, "_blank");
}

      <div class="rep-pill-btn ${REPRICER_STRATEGY==='PL_PROTECTED'?'on':''}" onclick="setRepricerStrategy('PL_PROTECTED')">🛡️ PL Protected (${countPlProt})</div>
      <div class="rep-pill-btn ${REPRICER_STRATEGY==='WINNING_BB'?'on':''}" onclick="setRepricerStrategy('WINNING_BB')">🏆 Winning BB (${countBBWin})</div>

      <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
        <input id="repSearch" type="search" placeholder="Search ASIN, SKU, Title, Seller…" value="${esc(REPRICER_QUERY)}"
          class="rep-search-input"
          oninput="REPRICER_QUERY=this.value;renderRepricer()">
        <span style="font-size:12px;color:#64748b;font-weight:700">${filtered.length} ASINs shown</span>
      </div>
    </div>

    <!-- Ultra Polished Data Table -->
    <div class="rep-table-container">
      <table class="rep-table">
        <thead>
          <tr>
            <th>ASIN</th>
            <th>SKU</th>
            <th>Repricing Intelligence</th>
            <th>Product Title</th>
            <th style="text-align:right">Aug Orders</th>
            <th style="text-align:right">Aug Units</th>
            <th style="text-align:right">Our Price</th>
            <th style="text-align:right">Zoro Cost (No Tax)</th>
            <th style="text-align:right">Gross Profit</th>
            <th style="text-align:center">Sellers</th>
            <th>Buy Box Winner</th>
            <th style="text-align:right">BB Price</th>
            <th style="text-align:center">In BB?</th>
            <th>Lowest 1 Seller &amp; Price</th>
            <th>Lowest 2 Seller &amp; Price</th>
            <th>Lowest 3 Seller &amp; Price</th>
            <th>Strategy Rationale</th>
            <th style="text-align:center">Amazon</th>
          </tr>
        </thead>
        <tbody>
  `;

  if(!filtered.length){
    html += `<tr><td colspan="18" style="padding:40px;text-align:center;color:#64748b;font-size:14px;font-weight:600">No listings matching this filter or search query.</td></tr>`;
  } else {
    for(const it of filtered){
      const isHijack = it.is_hijacked;
      const isRaise = it.strategy === "RAISE_PRICE";
      const isDrop = it.strategy === "DROP_PRICE_10PCT";
      const isPlProt = it.strategy === "PL_PROTECTED";

      let stratBadge = "";
      if(isHijack) {
        stratBadge = `<div class="rep-badge-hijack-alert">🚨 HIJACKED (${it.total_sellers} Sellers)</div>`;
      } else if(isRaise) {
        stratBadge = `
          <div class="rep-badge-rec-raise">
            <div class="target-price">🚀 RAISE to ${fmtCurrency(it.recommended_price)}</div>
            <div class="gain-pill">+${fmtCurrency(it.profit_delta_per_unit)}/unit (+${fmtCurrency(it.potential_monthly_gain)}/mo)</div>
          </div>`;
      } else if(isDrop) {
        stratBadge = `
          <div class="rep-badge-rec-drop">
            <div class="target-price">🎯 DROP to ${fmtCurrency(it.recommended_price)}</div>
            <div class="gain-pill">Reclaim Buy Box</div>
          </div>`;
      } else if(isPlProt) {
        const hasWrenchly = (it.strategy_badge||"").includes("Wrenchly");
        stratBadge = `<div class="rep-badge-pl-safe">🛡️ ${hasWrenchly ? 'PL PROTECTED (Wrenchly)' : 'PL PROTECTED'}</div>`;
      } else {
        stratBadge = `<div class="rep-badge-optimal">${esc(it.strategy_badge)}</div>`;
      }

      const bbBadge = it.is_our_buy_box === true ? `<span class="rep-bb-yes">YES</span>` :
                      (it.is_our_buy_box === false ? `<span class="rep-bb-no">NO</span>` : `—`);

      const low1Str = it.lowest_1_seller ? `<b>${fmtCurrency(it.lowest_1_price)}</b> <span style="color:#64748b;font-size:11px">(${esc(it.lowest_1_seller)})</span>` : "—";
      const low2Str = it.lowest_2_seller ? `<b>${fmtCurrency(it.lowest_2_price)}</b> <span style="color:#64748b;font-size:11px">(${esc(it.lowest_2_seller)})</span>` : "—";
      const low3Str = it.lowest_3_seller ? `<b>${fmtCurrency(it.lowest_3_price)}</b> <span style="color:#64748b;font-size:11px">(${esc(it.lowest_3_seller)})</span>` : "—";

      html += `
        <tr class="${isHijack?'row-hijack':''}">
          <td style="font-family:monospace !important;font-weight:800;color:#1e293b">
            <span class="asinlink" onclick="openAsin('${esc(it.asin)}')" style="cursor:pointer;color:#2563eb">${esc(it.asin)}</span>
          </td>
          <td style="font-family:monospace !important;font-size:11.5px;font-weight:${it.is_pl?800:500};color:${isHijack?'#b91c1c':(it.is_pl?'#0e7490':'#334155')}">
            ${esc(it.sku)}
          </td>
          <td>${stratBadge}</td>
          <td style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500" title="${esc(it.title)}">
            ${esc(it.title)}
          </td>
          <td style="text-align:right;font-weight:800;color:#0f172a">${fmtNumber(it.august_orders)}</td>
          <td style="text-align:right;font-weight:600">${fmtNumber(it.august_units)}</td>
          <td style="text-align:right;font-weight:800;color:#0f172a">${fmtCurrency(it.our_sale_price)}</td>
          <td style="text-align:right;color:#64748b;font-weight:600">${fmtCurrency(it.zoro_cost_notax)}</td>
          <td style="text-align:right;font-weight:800;color:${(it.gross_profit||0)>=0?'#059669':'#dc2626'}">
            ${fmtCurrency(it.gross_profit)}
            ${it.profit_margin_pct!=null?`<span style="font-size:10px;font-weight:500;color:#64748b"> (${it.profit_margin_pct}%)</span>`:''}
          </td>
          <td style="text-align:center;font-weight:800;${isHijack?'color:#b91c1c;font-size:13px':''}">${it.total_sellers}</td>
          <td style="font-weight:600">${esc(it.buy_box_seller||"—")}</td>
          <td style="text-align:right;font-weight:700">${fmtCurrency(it.buy_box_price)}</td>
          <td style="text-align:center">${bbBadge}</td>
          <td style="background:#f0fdf4;border-left:1px solid #bbf7d0">${low1Str}</td>
          <td style="background:#f8fafc">${low2Str}</td>
          <td style="background:#f8fafc">${low3Str}</td>
          <td style="max-width:260px;overflow:hidden;text-overflow:ellipsis;font-size:11.5px;color:#64748b;font-weight:500" title="${esc(it.reason)}">
            ${esc(it.reason)}
          </td>
          <td style="text-align:center">
            <a href="${esc(it.amazon_url)}" target="_blank" rel="noopener" class="rep-ext-link">Open ↗</a>
          </td>
        </tr>
      `;
    }
  }

  html += `
        </tbody>
      </table>
    </div>
  </div>
  `;

  $R.innerHTML = html;
}


</script>
